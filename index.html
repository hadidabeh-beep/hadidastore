<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عبد الرحمن وسيف | AB&S BOOSTING</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080d1a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-blue: #00d2ff;
            --accent-purple: #9d4edf;
            --accent-green: #10b981;
            --accent-gold: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --input-bg: #0f172a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 210, 255, 0.12), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(157, 78, 223, 0.12), transparent 40%);
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .logo-img {
            width: 100%;
            max-width: 260px;
            height: auto;
            border-radius: 16px;
            margin-bottom: 12px;
            border: 2px solid var(--accent-blue);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
        }

        .header h1 {
            font-size: 20px; font-weight: 900;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .whatsapp-support {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--accent-green);
            color: #34d399;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            margin-top: 10px;
            transition: 0.3s;
        }
        .whatsapp-support:hover { background: rgba(16, 185, 129, 0.3); }

        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; color: #cbd5e1; font-size: 13px; font-weight: 700; }

        input[type="text"], input[type="tel"], select, input[type="file"] {
            width: 100%; padding: 12px 14px; border-radius: 12px;
            border: 1px solid var(--border-color); background: var(--input-bg);
            color: var(--text-main); font-size: 13.5px; font-weight: 600; outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.3);
        }

        .payment-info {
            background: rgba(0, 210, 255, 0.08);
            border-right: 4px solid var(--accent-blue);
            padding: 12px; border-radius: 10px; font-size: 13px;
            margin-bottom: 15px; line-height: 1.6;
        }

        .phone-badges { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
        .phone-badge {
            background: #0f172a; border: 1px solid var(--accent-blue);
            padding: 4px 10px; border-radius: 8px; font-weight: 800; color: var(--accent-blue); font-size: 13px;
            direction: ltr;
        }

        .btn-submit {
            width: 100%; padding: 15px; border: none; border-radius: 14px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #fff; font-weight: 800; font-size: 16px; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 6px 20px rgba(0, 210, 255, 0.25);
        }

        .btn-submit:hover { transform: translateY(-2px); opacity: 0.95; }

        .processing-screen {
            display: none; text-align: center; padding: 10px 0;
        }

        .spinner {
            width: 55px; height: 55px; border: 4px solid var(--border-color);
            border-top: 4px solid var(--accent-blue); border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 15px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .order-code-badge {
            background: rgba(245, 158, 11, 0.15);
            border: 1px dashed var(--accent-gold);
            color: var(--accent-gold);
            padding: 10px; border-radius: 10px;
            font-size: 15px; font-weight: 800;
            margin: 10px 0;
            display: inline-block;
        }

        .timer-box {
            font-size: 30px; font-weight: 900; color: var(--accent-blue);
            margin: 10px 0; background: var(--input-bg); padding: 8px; border-radius: 10px;
            border: 1px solid var(--border-color); letter-spacing: 2px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div id="mainFormScreen">
        <div class="header">
            <img src="logo.jpg.jpeg" alt="عبد الرحمن وسيف" class="logo-img">
            <h1>عبد الرحمن وسيف | AB&S BOOSTING ⚡</h1>
            
            <!-- زر الدعم عبر الواتساب -->
            <a href="https://wa.me/201070681047" target="_blank" class="whatsapp-support">
                💬 خدمة العملاء والدعم الفني (WhatsApp): 01070681047
            </a>
        </div>

        <form id="orderForm">
            <div class="form-group">
                <label>اختر القسم المطلوب:</label>
                <select id="service" onchange="toggleFields()">
                    <option value="pubg">🎮 القسم الأول: شدات ببجي (PUBG UC)</option>
                    <option value="insta_followers">👤 القسم الثاني: متابعين إنستغرام</option>
                    <option value="insta_likes">❤️ القسم الثالث: إعجابات إنستغرام</option>
                </select>
            </div>

            <!-- شدات ببجي -->
            <div class="form-group" id="pubgGroup">
                <label>اختر الباقة:</label>
                <select id="pubgPackage">
                    <option value="60 UC - 40 EGP">60 UC - 40 جنيه مصري</option>
                    <option value="325 UC - 210 EGP">325 UC - 210 جنيه مصري</option>
                    <option value="660 UC - 400 EGP">660 UC - 400 جنيه مصري</option>
                    <option value="1800 UC - 1050 EGP">1800 UC - 1050 جنيه مصري</option>
                    <option value="3850 UC - 2200 EGP">3850 UC - 2200 جنيه مصري</option>
                    <option value="8100 UC - 4300 EGP">8100 UC - 4300 جنيه مصري</option>
                </select>
                <label style="margin-top: 10px;">آيدي اللعبة (Player ID):</label>
                <input type="text" id="playerId" placeholder="أدخل ID هنا">
            </div>

            <!-- متابعين إنستغرام -->
            <div class="form-group hidden" id="instaFollowersGroup">
                <label>اختر باقة المتابعين:</label>
                <select id="instaFollowersPkg">
                    <option value="500 Follower - 25 EGP">500 متابع - 25 جنيه</option>
                    <option value="1000 Follower - 75 EGP">1000 متابع - 75 جنيه</option>
                    <option value="2000 Follower - 100 EGP">2000 متابع - 100 جنيه</option>
                    <option value="2500 Follower - 125 EGP">2500 متابع - 125 جنيه</option>
                    <option value="4000 Follower - 170 EGP">4000 متابع - 170 جنيه</option>
                    <option value="5000 Follower - 200 EGP">5000 متابع - 200 جنيه</option>
                </select>
            </div>

            <!-- إعجابات إنستغرام -->
            <div class="form-group hidden" id="instaLikesGroup">
                <label>اختر باقة الإعجابات:</label>
                <select id="instaLikesPkg">
                    <option value="100 Likes - 20 EGP">100 إعجاب - 20 جنيه</option>
                    <option value="200 Likes - 35 EGP">200 إعجاب - 35 جنيه</option>
                    <option value="300 Likes - 45 EGP">300 إعجاب - 45 جنيه</option>
                    <option value="400 Likes - 60 EGP">400 إعجاب - 60 جنيه</option>
                    <option value="500 Likes - 80 EGP">500 إعجاب - 80 جنيه</option>
                </select>
            </div>

            <!-- حقل رابط إنستغرام -->
            <div class="form-group hidden" id="instaTargetGroup">
                <label>رابط الحساب / اليوزر أو رابط المنشور:</label>
                <input type="text" id="instaTarget" placeholder="@username أو رابط المنشور">
            </div>

            <!-- بيانات التحويل -->
            <div class="payment-info">
                💳 <strong>أرقام تحويل فودافون كاش / إنستا باي:</strong>
                <div class="phone-badges">
                    <span class="phone-badge">01070681047</span>
                    <span class="phone-badge">01042580982</span>
                </div>
            </div>

            <div class="form-group">
                <label>رقمك المحوَّل منه (لتأكيد العملية):</label>
                <input type="tel" id="senderPhone" placeholder="010xxxxxxx">
            </div>

            <!-- رفع سكرين شوت التحويل -->
            <div class="form-group">
                <label>إرفاق سكرين شوت إيصال التحويل (اختياري لتسريع الطلب):</label>
                <input type="file" id="screenshotFile" accept="image/*">
            </div>

            <button type="button" class="btn-submit" onclick="processOrder()">تأكيد الطلب والشحن الآن ⚡</button>
        </form>
    </div>

    <!-- شاشة الانتظار مع الكود المرجعي -->
    <div id="processingScreen" class="processing-screen">
        <div class="spinner"></div>
        <h2 style="color: var(--accent-blue); margin-bottom: 6px;">جاري تنفيذ طلبك...</h2>
        
        <p style="font-size: 13px; color: var(--text-muted);">الكود المرجعي لطلبك:</p>
        <div class="order-code-badge" id="orderCodeDisplay">#ABS-00000</div>

        <div class="timer-box" id="timer">05:00</div>

        <p style="font-size: 12.5px; color: var(--accent-gold); font-weight: 700; margin-bottom: 15px;">
            ⚡ فريق عبد الرحمن وسيف يراجع طلبك وينفذه الآن!
        </p>

        <!-- زر التواصل مع الدعم بالطلب المرجعي -->
        <a id="whatsappOrderLink" href="#" target="_blank" class="whatsapp-support" style="background: var(--accent-green); color: #fff;">
            📱 متابعة حالة الطلب عبر الواتساب
        </a>
    </div>
</div>

<script>
    function toggleFields() {
        const service = document.getElementById('service').value;

        document.getElementById('pubgGroup').classList.add('hidden');
        document.getElementById('instaFollowersGroup').classList.add('hidden');
        document.getElementById('instaLikesGroup').classList.add('hidden');
        document.getElementById('instaTargetGroup').classList.add('hidden');

        if (service === 'pubg') {
            document.getElementById('pubgGroup').classList.remove('hidden');
        } else if (service === 'insta_followers') {
            document.getElementById('instaFollowersGroup').classList.remove('hidden');
            document.getElementById('instaTargetGroup').classList.remove('hidden');
        } else if (service === 'insta_likes') {
            document.getElementById('instaLikesGroup').classList.remove('hidden');
            document.getElementById('instaTargetGroup').classList.remove('hidden');
        }
    }

    function sendTelegramMessage(chatId, botToken, message) {
        const fullUrl = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;
        fetch(fullUrl).catch(err => console.error("Error sending to " + chatId, err));
    }

    function processOrder() {
        const botToken = "8852055802:" + "AAGidZBnAt7V2pmR5EGtliov_KtLXYJV7BY";
        
        const myChatId = "1478944867";
        const partnerChatId = "7441159331";

        // توليد كود مرجعي فريد
        const orderCode = "#ABS-" + Math.floor(10000 + Math.random() * 90000);

        const service = document.getElementById('service').value;
        const fileInput = document.getElementById('screenshotFile');
        const hasScreenshot = fileInput.files.length > 0 ? "نعم (مرفق سكرين شوت)" : "لا يوجد";

        let message = `⚡ طلب جديد [${orderCode}] - AB&S BOOSTING\n\n`;

        if (service === 'pubg') {
            const pkg = document.getElementById('pubgPackage').value;
            const id = document.getElementById('playerId').value;
            const phone = document.getElementById('senderPhone').value;

            if (!id || !phone) { alert("يرجى ملء جميع البيانات المطلوب إدخالها!"); return; }
            message += `🎮 الخدمة: شحن شدات ببجي\n📦 الباقة: ${pkg}\n🆔 الآيدي: ${id}\n📱 رقم المحوّل: ${phone}\n🖼️ سكرين شوت: ${hasScreenshot}`;

        } else if (service.startsWith('insta_')) {
            let pkg = service === 'insta_followers' ? document.getElementById('instaFollowersPkg').value : document.getElementById('instaLikesPkg').value;
            const target = document.getElementById('instaTarget').value;
            const phone = document.getElementById('senderPhone').value;

            if (!target || !phone) { alert("يرجى ملء جميع البيانات المطلوب إدخالها!"); return; }
            message += `📸 الخدمة: إنستغرام (${service === 'insta_followers' ? 'متابعين' : 'إعجابات'})\n📦 الباقة: ${pkg}\n👤 الرابط/اليوزر: ${target}\n📱 رقم المحوّل: ${phone}\n🖼️ سكرين شوت: ${hasScreenshot}`;
        }

        // إرسال الرسالة لك ولشريكك
        sendTelegramMessage(myChatId, botToken, message);
        sendTelegramMessage(partnerChatId, botToken, message);

        // إظهار شاشة معالجة الطلب والتصاميم المحدثة
        document.getElementById('mainFormScreen').style.display = 'none';
        document.getElementById('processingScreen').style.display = 'block';
        document.getElementById('orderCodeDisplay').textContent = orderCode;

        // تجهيز رابط الواتساب الجاهز برقم الطلب
        const waMsg = encodeURIComponent(`مرحباً فريق AB&S BOOSTING، أريد الاستفسار عن حالة طلبي المرجعي: ${orderCode}`);
        document.getElementById('whatsappOrderLink').href = `https://wa.me/201070681047?text=${waMsg}`;

        // العداد التنازلي
        let timeInSeconds = 300;
        const timerElement = document.getElementById('timer');

        const countdown = setInterval(() => {
            let minutes = Math.floor(timeInSeconds / 60);
            let seconds = timeInSeconds % 60;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            minutes = minutes < 10 ? '0' + minutes : minutes;

            timerElement.textContent = `${minutes}:${seconds}`;

            if (timeInSeconds <= 0) {
                clearInterval(countdown);
                timerElement.textContent = "تم الشحن ✅";
                alert(`تم تنفيذ الطلب ${orderCode} بنجاح! شكراً لثقتكم بـ AB&S BOOSTING.`);
            }
            timeInSeconds--;
        }, 1000);
    }
</script>
</body>
</html>
